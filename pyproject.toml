[project]
name = "universal-fasion-size"
version = "1.0.0"
description = "Privacy-first, explainable cross-chart fashion sizing API"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.117,<1.0", "pydantic>=2.8,<3.0", "uvicorn>=0.34,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
