<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Animated minimalist Universal Fashion Size banner: thoughtful measurements and real people">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1a24"/><stop offset=".6" stop-color="#143742"/><stop offset="1" stop-color="#24484b"/></linearGradient><linearGradient id="mint" x1="0" x2="1"><stop stop-color="#c6f8df"/><stop offset="1" stop-color="#76cec4"/></linearGradient><pattern id="fine" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d3eee8" opacity=".08"/></pattern></defs>
<rect width="1200" height="320" rx="18" fill="url(#bg)"/><rect width="1200" height="320" rx="18" fill="url(#fine)"/>
